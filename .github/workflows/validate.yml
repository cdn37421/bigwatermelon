name: Validate ad-free game

on:
  push:
    branches: [main, chore/remove-ads, 'feature/**']
  pull_request:
    branches: [main, chore/remove-ads]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published JavaScript syntax
        run: |
          node --check main.js
          node --check src/settings.js
          node --check src/project.js
      - name: Check ad-free game invariants
        run: node --test tests/ad-free.test.cjs
